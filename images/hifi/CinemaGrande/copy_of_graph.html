<html>
  <head>
    <title>Google Developers</title>
    <link rel="stylesheet" type="text/css" href="/_static/css/screen.css" />
    <link rel="stylesheet" href="//www.google.com/cse/style/look/default.css" type="text/css" />
    <link href='//fonts.googleapis.com/css?family=Open+Sans:300,400' rel='stylesheet' type='text/css'>
    <script src="//ajax.googleapis.com/ajax/libs/jquery/1.6.1/jquery.min.js"></script>
    <script id="jqueryui" src="//ajax.googleapis.com/ajax/libs/jqueryui/1.8.10/jquery-ui.min.js" defer async></script>
    <script src="//www.google.com/jsapi?key=AIzaSyCZfHRnq7tigC-COeQRmoa9Cxr0vbrK6xw"></script>
    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->
  </head>
  <body class="docs framebox_body">
<script type="text/javascript" src="//www.google.com/jsapi"></script>
<div id="gauge_div" style="width:280px; height: 140px;"></div>

<script type="text/javascript">

google.load('visualization', '1', {packages: ['table', 'gauge', 'intensitymap', 'corechart']});
google.setOnLoadCallback(drawGauge);

var gaugeOptions = {min: 0, max: 280, yellowFrom: 200, yellowTo: 250,
    redFrom: 250, redTo: 280, minorTicks: 5};
var gauge;

function drawGauge() {
  gaugeData = new google.visualization.DataTable();
  gaugeData.addColumn('number', 'Engine');
  gaugeData.addColumn('number', 'Torpedo');
  gaugeData.addRows(2);
  gaugeData.setCell(0, 0, 120);
  gaugeData.setCell(0, 1, 80);

  gauge = new google.visualization.Gauge(document.getElementById('gauge_div'));
  gauge.draw(gaugeData, gaugeOptions);
}

function changeTemp(dir) {
   gaugeData.setValue(0, 0, gaugeData.getValue(0, 0) + dir * 25);
   gaugeData.setValue(0, 1, gaugeData.getValue(0, 1) + dir * 20);
   gauge.draw(gaugeData, gaugeOptions);
}

</script>

<input type="button" value="Go Faster" onclick="changeTemp(1)" />
<input type="button" value="Slow down" onclick="changeTemp(-1)" />

</body>
</html>
