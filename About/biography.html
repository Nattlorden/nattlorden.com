<!DOCTYPE html>
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Biografi</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f4f4;
      color: #222;
    }

    .layout {
      display: grid;
      grid-template-columns: 280px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      padding: 1.5rem;
      background: #e8e8e8;
      border-right: 1px solid #ccc;
      overflow-y: auto;
    }

    .sidebar h1 {
      margin-top: 0;
      font-size: 1.4rem;
    }

    .note-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .note-list li {
      margin: 0.25rem 0;
    }

    .note-list button {
      width: 100%;
      padding: 0.4rem 0.5rem;
      border: 0;
      background: none;
      text-align: left;
      font: inherit;
      cursor: pointer;
      border-radius: 4px;
    }

    .note-list button:hover {
      background: rgba(0, 0, 0, 0.08);
    }

    .note-list button.active {
      background: rgba(0, 0, 0, 0.14);
      font-weight: 600;
    }

    .content {
      max-width: 900px;
      padding: 2rem 3rem;
    }

    .content h1 {
      margin-top: 0;
    }

    .note-body {
      line-height: 1.6;
    }

    .note-body p {
      margin: 0 0 1rem;
    }

    .internal-link {
      color: #375a9e;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .internal-link.unresolved {
      color: #8a5555;
      text-decoration-style: dotted;
    }

    .external-link {
      color: #375a9e;
    }

    .properties,
    .relations {
      margin-top: 2rem;
      padding-top: 1rem;
      border-top: 1px solid #ccc;
      font-size: 0.9rem;
    }

    .properties h2,
    .relations h2 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
    }

    .properties dl {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 0.25rem 1rem;
    }

    .properties dt {
      font-weight: 600;
    }

    .properties dd {
      margin: 0;
    }

    .relation-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .relation-list button {
      border: 1px solid #bbb;
      background: #fff;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
    }

    .empty {
      opacity: 0.6;
      font-style: italic;
    }

     .sidebar-header {
  display: flex;
  align-items: center;
  gap: 0.8rem;
  margin-bottom: 1rem;
}

.sidebar-header h1 {
  margin: 0;
}

.back-home {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
}

.back-home img {
  display: block;
  height: 30px;
  /*width: auto; */
  filter: saturate(0.7) brightness(0.95);
  opacity: 0.7;
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.back-home img:hover {
  opacity: 1;
  transform: translateX(-2px);
}

    @media (max-width: 750px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .sidebar {
        border-right: 0;
        border-bottom: 1px solid #ccc;
      }

      .content {
        padding: 1.5rem;
      }


}
  </style>
</head>

<body>

<div class="layout">

  <aside class="sidebar">

  <div class="sidebar-header">
  <a href="/" class="back-home" title="Tillbaka till startsidan">
    <img src="assets/ui/back-arrow.png" alt="Tillbaka">
  </a>

  <h1>Anteckningar</h1>
</div>
  <ul id="noteList" class="note-list"></ul>
</aside>

  <main id="content" class="content">
    <p class="empty">Välj en anteckning.</p>
  </main>

</div>

<script src="js/biography.js"></script>

</body>
</html>
