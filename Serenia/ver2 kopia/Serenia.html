<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Serenia</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="branding">
        <h1>Serenia</h1>
        <p class="tagline" id="tagline">A world beneath memory and stone</p>
      </div>

      <div class="lang-switch">
        <button type="button" id="btn-sv" onclick="setLang('sv')">SV</button>
        <button type="button" id="btn-en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </header>

  <nav class="top-menu" id="topMenu"></nav>

  <div class="layout">
    <aside class="side-menu" id="sideMenu"></aside>
    <main class="content-area" id="content"></main>
  </div>

  <script src="js/menu.js"></script>
  <script src="js/content-sv.js"></script>
  <script src="js/content-en.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
