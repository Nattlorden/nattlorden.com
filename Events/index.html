<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Social preview -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Nattlorden.com">
  <meta property="og:description" content="Homepage universe of Nattlorden">
  <meta property="og:url" content="https://nattlorden.com">
  <meta property="og:image" content="https://nattlorden.com/assets/social/landing-preview.jpg">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://nattlorden.com/assets/social/landing-preview.jpg">

  <title>Events</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header" id="siteHeader">
  <div class="header-left">
    <a href="/" class="back-home" title="Tillbaka till startsidan">
      <img src="assets/ui/back-arrow.png" alt="Tillbaka">
    </a>
  </div>

  <div class="header-inner">
    <div class="branding">
      <h1 id="siteTitle">Places</h1>
      <p class="tagline" id="tagline">Visited and to visit</p>
    </div>
  </div>

  <div class="header-right">
    <div class="lang-switch">
      <button type="button" id="btn-sv" onclick="setLang('sv')">SV</button>
      <button type="button" id="btn-en" onclick="setLang('en')">EN</button>
    </div>
  </div>
</header>

<nav class="top-menu" id="topMenu"></nav>

<div class="layout">
  <aside class="side-menu" id="sideMenu"></aside>
  <main class="content-area" id="content"></main>
</div>

<script src="js/menu.js"></script>
<script src="js/content-sv.js"></script>
<script src="js/content-en.js"></script>
<script src="../js/common-navigation.js"></script>
<script src="../js/common-components.js"></script>
<script src="js/app.js"></script>
</body>
</html>
