<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Förlorade visor – Wilhelm von Braun</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header header-wvb">

  <div class="header-left">
    <a href="/" class="back-home">
      <img src="assets/ui/back-arrow.png" alt="Tillbaka">
    </a>
  </div>

  <div class="header-inner">
    <div class="branding">
      <h1>Förlorade visor</h1>
      <p class="tagline">
        <b>Wilhelm von Braun</b><br><i><font color=grey>(1813–1860)</font></i>
      </p>
    </div>
  </div>

  <div class="header-right">
    <div class="header-portrait">
      <img src="assets/ui/portrait.png"
           alt="Wilhelm von Braun">
    </div>
    <div class="lang-switch">
      <button  id="btn-sv" onclick="setLang('sv')">SV</button>
      <button  id="btn-en" onclick="setLang('en')">EN</button>
    <div>

    
  </div>

</header>
